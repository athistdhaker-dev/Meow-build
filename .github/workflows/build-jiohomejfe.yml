name: Build JioHomeJFE Fixed APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract JioHomeJFE ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f \( -iname '*.zip' \) -print -quit)"

          if [ -z "${ZIP}" ]; then
            echo "::error::No ZIP file found in repository root."
            echo "Upload the JioHomeJFE-Android16-Fix-GitHubActions.zip file to the repository root."
            exit 1
          fi

          echo "Using: ${ZIP}"

          rm -rf _build
          mkdir -p _build
          unzip -q "${ZIP}" -d _build

          # The supplied ZIP contains one top-level project directory.
          PROJECT_DIR="$(find _build -mindepth 1 -maxdepth 1 -type d -print -quit)"

          if [ -z "${PROJECT_DIR}" ]; then
            echo "::error::Could not find the extracted project directory."
            exit 1
          fi

          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"

          test -f "${PROJECT_DIR}/scripts/build.sh"
          test -f "${PROJECT_DIR}/scripts/patch.py"
          test -f "${PROJECT_DIR}/input/app.apk"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip wget python3

      - name: Download Apktool
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools

          wget -q -O tools/apktool.jar \
            https://repo1.maven.org/maven2/org/apktool/apktool/3.0.3/apktool-3.0.3.jar

          java -jar tools/apktool.jar --version

      - name: Download Uber APK Signer
        shell: bash
        run: |
          set -euo pipefail
          wget -q -O tools/uber-apk-signer.jar \
            https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

          java -jar tools/uber-apk-signer.jar --version || true

      - name: Place build tools next to extracted project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${PROJECT_DIR}/tools"
          cp tools/apktool.jar "${PROJECT_DIR}/tools/apktool.jar"
          cp tools/uber-apk-signer.jar "${PROJECT_DIR}/tools/uber-apk-signer.jar"

      - name: Build patched APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${PROJECT_DIR}"

          chmod +x scripts/build.sh

          java -jar tools/apktool.jar --version >/dev/null

          ./scripts/build.sh

      - name: Collect build output
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p release

          if compgen -G "${PROJECT_DIR}/out/*-signed.apk" > /dev/null; then
            cp "${PROJECT_DIR}"/out/*-signed.apk release/
          else
            echo "::error::No signed APK was produced."
            echo "Build directory contents:"
            find "${PROJECT_DIR}/out" -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          ls -lh release/

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: JioHomeJFE-fixed
          path: release/*.apk
          if-no-files-found: error
          retention-days: 14
