name: Fix patched APK (QR scan crash)

# Repo ke root me sirf patched APK rakho (naam me "patched" ho).
# Yeh workflow khud ML Kit ki missing native lib (libbarhopper_v3.so) download
# karke APK me daalta hai, zipalign + sign karta hai.

on:
  workflow_dispatch:
  push:
    paths: ["*.apk"]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find patched APK
        run: |
          PATCHED=$(ls *patched*.apk 2>/dev/null | head -1 || true)
          [ -n "$PATCHED" ] || { echo "::error::Root me *patched*.apk nahi mila"; exit 1; }
          echo "PATCHED=$PATCHED" >> "$GITHUB_ENV"
          echo "patched: $PATCHED"

      - name: Download ML Kit native libs
        run: |
          VER=$(unzip -p "$PATCHED" barcode-scanning.properties | sed -n 's/^version=//p' | head -1)
          VER=${VER:-17.3.0}
          echo "ML Kit barcode-scanning version: $VER"
          curl -fL --retry 3 -o mlkit.aar \
            "https://dl.google.com/dl/android/maven2/com/google/mlkit/barcode-scanning/$VER/barcode-scanning-$VER.aar"
          unzip -l mlkit.aar | grep -E "\.so$" || { echo "::error::AAR me .so nahi mila"; exit 1; }

      - name: Inject native libs
        run: |
          python3 - "$PATCHED" unsigned.apk mlkit.aar <<'PY'
          import re, sys, zipfile
          patched, out, aar = sys.argv[1:4]
          SIG = re.compile(r"^META-INF/[^/]+\.(RSA|DSA|EC|SF|MF)$", re.I)
          ABIS = ("arm64-v8a", "armeabi-v7a")
          libs = {}
          with zipfile.ZipFile(aar) as z:
              for n in z.namelist():
                  m = re.match(r"^jni/([^/]+)/([^/]+\.so)$", n)
                  if m and m.group(1) in ABIS:
                      libs[f"lib/{m.group(1)}/{m.group(2)}"] = z.read(n)
          if not libs:
              sys.exit("ERROR: AAR me arm64-v8a/armeabi-v7a libs nahi mile")
          with zipfile.ZipFile(patched) as src, zipfile.ZipFile(out, "w") as dst:
              for it in src.infolist():
                  if SIG.match(it.filename) or it.filename in libs:
                      continue
                  dst.writestr(it, src.read(it.filename), compress_type=it.compress_type)
              for n, d in sorted(libs.items()):
                  dst.writestr(zipfile.ZipInfo(n, (2020, 1, 1, 0, 0, 0)), d,
                               compress_type=zipfile.ZIP_STORED)
          print("added:", *sorted(libs), sep="\n  ")
          PY

      - name: Zipalign
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "BT=$BT" >> "$GITHUB_ENV"
          "$BT/zipalign" -p -f 4 unsigned.apk aligned.apk

      - name: Sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.jks
            ALIAS="$KS_ALIAS"; PASS="$KS_PASS"
          else
            PASS=android; ALIAS=debug
            keytool -genkeypair -keystore release.jks -storepass $PASS -keypass $PASS \
              -alias $ALIAS -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug"
          fi
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$ALIAS" \
            --ks-pass pass:"$PASS" --key-pass pass:"$PASS" \
            --out JioHomeJFE_fixed.apk aligned.apk
          "$BT/apksigner" verify --verbose JioHomeJFE_fixed.apk
          unzip -l JioHomeJFE_fixed.apk | grep -E "\.so$"

      - uses: actions/upload-artifact@v4
        with:
          name: JioHomeJFE_fixed
          path: JioHomeJFE_fixed.apk
